<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Lasya ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Segoe UI", sans-serif;

            background:
                radial-gradient(circle at top, #ff758c, transparent 40%),
                linear-gradient(135deg, #1a001f, #3b003d, #140014);

            color: white;
        }

        .container {
            text-align: center;
            padding: 50px;
            position: relative;
            z-index: 10;
        }

        .heart {
            font-size: 90px;
            animation: heartbeat 1.2s infinite;
            filter: drop-shadow(0 0 25px #ff4d88);
        }

        h1 {
            margin-top: 20px;
            font-size: clamp(42px, 8vw, 80px);

            background: linear-gradient(
                90deg,
                #fff,
                #ffb6c9,
                #ff4d88,
                #fff
            );

            background-size: 300%;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: shine 4s infinite linear;
        }

        .message {
            margin-top: 25px;
            font-size: 24px;
            color: #ffd6e2;
            letter-spacing: 2px;
        }

        .sub {
            margin-top: 15px;
            font-size: 16px;
            color: #ffb6c9;
            opacity: 0.8;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp linear infinite;
            opacity: 0;
        }

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }

        @keyframes shine {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Lasya Ma'am</h1>

        <div class="message">
            I Love You ❤️
        </div>

        <div class="sub">
            You make every moment a little more beautiful ✨
        </div>

    </div>


    <!-- Floating Hearts -->

    <span class="floating-heart" style="left: 5%; animation-duration: 8s;">❤️</span>
    <span class="floating-heart" style="left: 15%; animation-duration: 11s;">💗</span>
    <span class="floating-heart" style="left: 25%; animation-duration: 7s;">💕</span>
    <span class="floating-heart" style="left: 35%; animation-duration: 10s;">❤️</span>
    <span class="floating-heart" style="left: 45%; animation-duration: 8s;">💖</span>
    <span class="floating-heart" style="left: 55%; animation-duration: 12s;">💗</span>
    <span class="floating-heart" style="left: 65%; animation-duration: 9s;">💕</span>
    <span class="floating-heart" style="left: 75%; animation-duration: 7s;">❤️</span>
    <span class="floating-heart" style="left: 85%; animation-duration: 11s;">💖</span>
    <span class="floating-heart" style="left: 95%; animation-duration: 8s;">💗</span>

</body>
</html>
